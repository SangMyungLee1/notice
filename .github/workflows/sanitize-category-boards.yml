name: Sanitize category board hubs
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sanitize-category-boards-main
  cancel-in-progress: false

jobs:
  sanitize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Remove invalid optional blocks
        run: node scripts/sanitize-board-indexes.mjs --fix
      - name: Validate board structure
        run: node scripts/sanitize-board-indexes.mjs --check
      - name: Commit only the four category indexes when needed
        run: |
          if ! git diff --quiet -- moving/index.html internet/index.html water/index.html rentcar/index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- moving/index.html internet/index.html water/index.html rentcar/index.html
            git commit -m "Remove malformed category hub cards without changing posts"
            git push origin HEAD:main
          fi
